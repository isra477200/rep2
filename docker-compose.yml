services:
  redvitalia-radar:
    image: ghcr.io/isra477200/redvitalia-radar:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.redvitalia.rule=Host(`redvitalia.srv1480016.hstgr.cloud`)
      - traefik.http.routers.redvitalia.entrypoints=websecure
      - traefik.http.routers.redvitalia.tls.certresolver=letsencrypt
      - traefik.http.services.redvitalia.loadbalancer.server.port=3000
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.wrangler:size=16m,uid=1000,gid=1000
