name: Finalize RedVitalia Nichos v2

on:
  push:
    branches:
      - chatgpt/nichos-v2-20260902

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/nichos-v2-20260902
          fetch-depth: 0

      - name: Apply reviewed financial fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/nichos/NichosDashboard.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'maximumFractionDigits: 0,',
                  'maximumFractionDigits: 2,',
              ),
              (
                  'const maxCpl = profitPerSale * values.qualificationPct / 100 * values.showPct / 100 * values.closePct / 100;',
                  'const expectedGrossProfitPerLead = profitPerSale * values.qualificationPct / 100 * values.showPct / 100 * values.closePct / 100;\n  const maxCpl = values.media > 0 ? expectedGrossProfitPerLead / (1 + fee / values.media) : 0;',
              ),
              (
                  '<p>IVA: {euro.format(price.vat)} · Total: {euro.format(price.gross)}</p>',
                  '<p>{euro.format(price.net)} × 21% = {euro.format(price.vat)} IVA · Total: {euro.format(price.gross)}</p>',
              ),
              (
                  'const strategy = STRATEGY[niche.id];\n            return (',
                  'const strategy = STRATEGY[niche.id];\n            if (!strategy) return null;\n            return (',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Reemplazo no seguro: {old[:70]!r} aparece {count} veces')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build and validate
        run: |
          npm ci
          npm run build
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const index = JSON.parse(fs.readFileSync('public/data/nichos/index.json', 'utf8'));
          if (!Array.isArray(index.files) || index.files.length !== 10) throw new Error('El índice debe contener 10 nichos');
          for (const file of index.files) {
            const local = path.join('public', file.replace(/^\//, ''));
            const niche = JSON.parse(fs.readFileSync(local, 'utf8'));
            if (!niche.id || !niche.name || !Array.isArray(niche.competitors)) throw new Error(`Nicho inválido: ${file}`);
          }
          NODE

      - name: Commit the reviewed version and remove this temporary workflow
        run: |
          rm .github/workflows/finalize-nichos-v2.yml
          git config user.name "ChatGPT RedVitalia"
          git config user.email "info@agenciawebseo.com"
          git add -A
          git commit -m "Afina cálculos y trazabilidad de Nichos v2"
          git push origin HEAD:chatgpt/nichos-v2-20260902
