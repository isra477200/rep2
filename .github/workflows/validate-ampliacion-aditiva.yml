name: Validate additive RedVitalia expansion

on:
  push:
    branches:
      - chatgpt/ampliacion-aditiva-redvitalia-20260903

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build portal
        run: npm run build
      - name: Verify additive boundaries
        run: |
          test -f app/sistemas/page.tsx
          test -f app/sistemas/NichosDashboard.tsx
          grep -q 'view === "verticals"' app/Portal.tsx
          ! grep -q 'NicheNavBridge' app/layout.tsx
          echo 'Existing portal preserved and /sistemas added.'
