name: Update Hostinger RedVitalia live

on:
  push:
    branches:
      - chatgpt/hostinger-update-live-20260902

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update the RedVitalia Docker project
        env:
          HOSTINGER_TOKEN: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN || secrets.HOSTINGER_TOKEN || secrets.HAPI_API_TOKEN || secrets.APITOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOSTINGER_TOKEN:-}" ]; then
            echo 'NO_HOSTINGER_TOKEN: none of the supported secret names is configured.'
            exit 2
          fi
          response=$(curl --silent --show-error --write-out '\n%{http_code}' \
            --request POST \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${HOSTINGER_TOKEN}" \
            'https://developers.hostinger.com/api/vps/v1/virtual-machines/1480016/docker/redvitalia/update')
          body=$(printf '%s\n' "$response" | sed '$d')
          status=$(printf '%s\n' "$response" | tail -n1)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "$body"
            echo "HOSTINGER_UPDATE_FAILED: HTTP $status"
            exit 1
          fi
          echo 'HOSTINGER_UPDATE_ACCEPTED: RedVitalia project is pulling the latest image.'
