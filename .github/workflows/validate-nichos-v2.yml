name: Validate RedVitalia Nichos v2

on:
  push:
    branches:
      - chatgpt/nichos-v2-20260902

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portal
        run: npm run build

      - name: Validate niche data files
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const index = JSON.parse(fs.readFileSync('public/data/nichos/index.json', 'utf8'));
          if (!Array.isArray(index.files) || index.files.length !== 10) throw new Error('El índice debe contener 10 nichos');
          for (const file of index.files) {
            const local = path.join('public', file.replace(/^\//, ''));
            const niche = JSON.parse(fs.readFileSync(local, 'utf8'));
            if (!niche.id || !niche.name || !Array.isArray(niche.competitors)) throw new Error(`Nicho inválido: ${file}`);
          }
          console.log('10 nichos y sus cruces competitivos validados.');
          NODE
