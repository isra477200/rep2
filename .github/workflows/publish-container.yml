name: Publish RedVitalia portal

on:
  push:
    branches:
      - redvitalia-radar-deploy

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/isra477200/redvitalia-inteligencia:latest
            ghcr.io/isra477200/redvitalia-inteligencia:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/isra477200/rep2
            org.opencontainers.image.title=Inteligencia Mundial de Captación · RedVitalia
          cache-from: type=gha
          cache-to: type=gha,mode=max
