name: Publish RedVitalia portal

on:
  push:
    branches:
      - redvitalia-radar-deploy

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/isra477200/redvitalia-inteligencia:latest
            ghcr.io/isra477200/redvitalia-inteligencia:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/isra477200/rep2
            org.opencontainers.image.title=Inteligencia Mundial de Captación · RedVitalia
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Hostinger Docker project
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOSTINGER_API_KEY:-}" ]; then
            echo 'HOSTINGER_API_KEY is not configured; image published without automatic Docker restart.'
            exit 0
          fi
          response=$(curl --silent --show-error --write-out '\n%{http_code}' \
            --request POST \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${HOSTINGER_API_KEY}" \
            'https://developers.hostinger.com/api/vps/v1/virtual-machines/1480016/docker/redvitalia/update')
          body=$(printf '%s\n' "$response" | sed '$d')
          status=$(printf '%s\n' "$response" | tail -n1)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "$body"
            echo "Hostinger update failed with HTTP $status"
            exit 1
          fi
          echo "Hostinger accepted the RedVitalia project update."
